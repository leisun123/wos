[project]
name = "wos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adbnativeblitz>=0.11",
    "adbutils>=2.8.9",
    "fastapi==0.135.3",
    "opencv-python>=4.11.0.86",
    "paddleocr==2.10.0",
    "paddlepaddle==3.2.0",
    "setuptools>=80.4.0",
    "uvicorn>=0.44.0",
    "rapidfuzz>=3.14.5",
    "rich>=15.0.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0"
]

[tool.pytest.ini_options]
markers = [
    "slow: heavy screenshot-replay OCR tests (run by the Nightly workflow)",
]
